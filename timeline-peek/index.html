<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Timeline Peek</title>
<!--
  A relying-party app. Two modes:
   • owner   — scoped twitter token from the OAuth3 node. With the extension,
               window.oauth3.connect() carries the whole flow. Without it
               (e.g. a phone), the app self-provisions an Ed25519 did:key wallet
               in this browser, signs into the node, and runs the connect
               handshake itself — same path /login's "Continue in this browser" uses.
   • shared  — ?token=<scoped> in the URL: a public, revocable share of one feed.
  Either way it only ever fetches the OAuth3 node's /api/twitter/feed. No cookies.
-->
<style>
/* pod design system · constructivist overprint · grape-acid inking */
:root{
  --ink1:#6f57a8; --ink2:#b5d33d; --paper:#f8f7f3; --deep:#2e2745; --overprint:#31491f;
  --bg:var(--paper); --text:var(--deep);
  --faint:color-mix(in srgb,var(--deep) 55%,var(--paper));
  --rule:color-mix(in srgb,var(--deep) 16%,var(--paper));
  --card:#fff; --block:var(--deep); --block-text:#f8f7f3;
  --wash1:color-mix(in srgb,var(--ink1) 15%,var(--paper));
  --wash2:color-mix(in srgb,var(--ink2) 17%,var(--paper));
  --i1-text:#5a4590; --i2-text:#6d8317;
  --warn:#a8780c; --warn-wash:color-mix(in srgb,#e0a41a 22%,var(--paper));
  --sans:"Helvetica Neue",Arial,sans-serif;
  --cond:"Arial Narrow","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --off:1px;
}
@media (prefers-color-scheme: dark){ :root{
  --ink1:#9b82d6; --ink2:#cbe85c; --paper:#181524; --deep:#100d1a;
  --bg:#181524; --text:#e8e3f0;
  --faint:color-mix(in srgb,#e8e3f0 55%,#181524);
  --rule:color-mix(in srgb,#e8e3f0 14%,#181524);
  --card:#221d33; --block:#100d1a; --block-text:#e8e3f0;
  --wash1:color-mix(in srgb,#9b82d6 20%,#181524);
  --wash2:color-mix(in srgb,#cbe85c 20%,#181524);
  --i1-text:#b9a4e2; --i2-text:#d6f07a;
  --warn:#e0b34a; --warn-wash:color-mix(in srgb,#e0b34a 18%,#181524);
}}
:root[data-theme="dark"]{
  --ink1:#9b82d6; --ink2:#cbe85c; --paper:#181524; --deep:#100d1a;
  --bg:#181524; --text:#e8e3f0;
  --faint:color-mix(in srgb,#e8e3f0 55%,#181524);
  --rule:color-mix(in srgb,#e8e3f0 14%,#181524);
  --card:#221d33; --block:#100d1a; --block-text:#e8e3f0;
  --wash1:color-mix(in srgb,#9b82d6 20%,#181524);
  --wash2:color-mix(in srgb,#cbe85c 20%,#181524);
  --i1-text:#b9a4e2; --i2-text:#d6f07a;
  --warn:#e0b34a; --warn-wash:color-mix(in srgb,#e0b34a 18%,#181524);
}
:root[data-theme="light"]{
  --ink1:#6f57a8; --ink2:#b5d33d; --paper:#f8f7f3; --deep:#2e2745;
  --bg:#f8f7f3; --text:#2e2745;
  --faint:color-mix(in srgb,#2e2745 55%,#f8f7f3);
  --rule:color-mix(in srgb,#2e2745 16%,#f8f7f3);
  --card:#fff; --block:#2e2745; --block-text:#f8f7f3;
  --wash1:color-mix(in srgb,#6f57a8 15%,#f8f7f3);
  --wash2:color-mix(in srgb,#b5d33d 17%,#f8f7f3);
  --i1-text:#5a4590; --i2-text:#6d8317;
  --warn:#a8780c; --warn-wash:color-mix(in srgb,#e0a41a 22%,#f8f7f3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
a{color:var(--i1-text)}:focus-visible{outline:2px solid var(--ink2);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 60px}
header{padding:26px 4px 16px}
h1.display{font:800 clamp(28px,5vw,40px)/0.94 var(--cond);text-transform:uppercase;margin:0 0 4px;color:var(--ink1);text-shadow:var(--off) var(--off) 0 var(--ink2);text-wrap:balance}
.sub{color:var(--faint);font:13px var(--mono);margin:6px 0 0}
.label{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:lowercase;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);padding:4px 10px;border-radius:999px;background:var(--wash1);color:var(--i1-text)}
.btn{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--cond);text-transform:uppercase;letter-spacing:.12em;border:0;padding:12px 22px;cursor:pointer;background:var(--ink1);color:#fff;box-shadow:3px 3px 0 var(--ink2)}
.btn:disabled{opacity:.5;cursor:default}
.note{margin-top:14px;color:var(--faint);font:13px/1.6 var(--mono)}
.note.err{color:var(--i2-text)}
.t{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--rule)}
.av{width:42px;height:42px;background:var(--block);display:flex;align-items:center;justify-content:center;font:800 16px var(--cond);color:var(--i2-text);flex:0 0 42px}
.body{min-width:0;flex:1}.hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nm{font-weight:700}.hn,.dot,.tm{color:var(--faint);font:13px var(--mono)}
.tx{margin:3px 0 9px;white-space:pre-wrap;word-wrap:break-word}.media{color:var(--faint);font:13px var(--mono)}
.st{display:flex;gap:22px;color:var(--faint);font:13px var(--mono)}
footer{color:var(--faint);font:12px var(--mono);text-align:center;padding:24px 0;border-top:1px solid var(--rule);margin-top:8px}
</style>
<div class=wrap>
  <header>
    <p class=label>oauth3 · relying-party demo</p>
    <h1 class=display>Timeline Peek</h1>
    <div class=sub id=sub>A logged-in X feed, reconstructed.</div>
    <div style=margin-top:10px><span class=pill>🔒 a scoped, revocable token · cookies never leave the TEE</span></div>
    <div style=margin-top:16px><button id=go class=btn>Connect with OAuth3</button></div>
    <div id=note class=note></div>
  </header>
  <div id=feed></div>
  <footer id=foot hidden>Rendered by a relying-party app from a scoped token.<br>OAuth3 holds the session; this app only ever sees the feed. The owner can revoke this link any time.</footer>
</div>
<script>
const NODE = location.origin + "/oauth3";
const $ = (id) => document.getElementById(id);
const esc = (s) => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card = (it) => {
  const s = (it.stats||[]).concat(["","","",""]);
  const tx = esc(it.text) || '<span class=media>🖼 media</span>';
  return `<article class=t><div class=av>${esc((it.name||"?")[0])}</div><div class=body>
    <div class=hd><span class=nm>${esc(it.name)}</span><span class=hn>${esc(it.handle)}</span>
    <span class=dot>·</span><span class=tm>${esc(it.time)}</span></div>
    <div class=tx>${tx}</div>
    <div class=st><span>💬 ${esc(s[0])}</span><span>🔁 ${esc(s[1])}</span><span>♥ ${esc(s[2])}</span><span>📊 ${esc(s[3])}</span></div>
    </div></article>`;
};
async function loadFeed(token) {
  const r = await fetch(NODE + "/api/twitter/feed", { headers: { Authorization: "Bearer " + token } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ("feed " + r.status));
  const items = body.items || [];
  $("note").textContent = ""; $("foot").hidden = false;
  $("sub").textContent = "For You · reconstructed, " + items.length + " posts";
  $("feed").innerHTML = items.map(card).join("");
}
// --- owner mode: get a scoped twitter token from the OAuth3 node ---
// With the extension: window.oauth3.connect() carries the whole flow (copies the
// jar, approves, hands back a token). Without the extension (e.g. on a phone) we
// self-provision an Ed25519 did:key wallet in this browser, sign into the node via
// POST /api/login (the same "Continue in this browser" path /login uses), then run
// the connect handshake and approve it with that session. Either way this app only
// ever sees the scoped token; cookies stay sealed in the TEE.
const DK = "oauth3_didkey", SK = "oauth3_session";
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const b64 = (u) => btoa(String.fromCharCode(...u));
const b64uDec = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(s + "=".repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0)); };
const b58e = (b) => { const d = [0]; for (const x of b) { let c = x; for (let j = 0; j < d.length; j++) { c += d[j] << 8; d[j] = c % 58; c = (c / 58) | 0; } while (c) { d.push(c % 58); c = (c / 58) | 0; } } let s = ""; for (const x of b) { if (x === 0) s += "1"; else break; } for (let k = d.length - 1; k >= 0; k--) s += B58[d[k]]; return s; };

// Ed25519 keypair kept in localStorage; the public side becomes a did:key. The
// private key never leaves the browser — the server only ever sees DID + signature.
async function walletKey() {
  let jwk = JSON.parse(localStorage.getItem(DK) || "null");
  if (!jwk) {
    const kp = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
    jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
    localStorage.setItem(DK, JSON.stringify(jwk));
  }
  const priv = await crypto.subtle.importKey("jwk", jwk, { name: "Ed25519" }, false, ["sign"]);
  const did = "did:key:z" + b58e(Uint8Array.from([0xed, 0x01, ...b64uDec(jwk.x)]));
  return { priv, did };
}

// Sign into the node with the self-provisioned wallet. Reuses a still-valid session
// if one is already in localStorage; otherwise signs a fresh challenge. Throws the
// real error on any failure — nothing is masked.
async function walletSignIn() {
  const stored = localStorage.getItem(SK);
  if (stored) {
    try {
      const me = await (await fetch(NODE + "/api/me", { headers: { Authorization: "Bearer " + stored } })).json();
      if (me && me.signedIn) return stored;
    } catch (_) { /* session invalid/unreachable — fall through and re-sign-in */ }
  }
  const { priv, did } = await walletKey();
  const { challenge } = await (await fetch(NODE + "/api/login/challenge")).json();
  const sig = b64(new Uint8Array(await crypto.subtle.sign({ name: "Ed25519" }, priv, new TextEncoder().encode(challenge))));
  const r = await fetch(NODE + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ did, challenge, signature: sig }) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ("login " + r.status));
  localStorage.setItem(SK, body.session);
  return body.session;
}

// connect handshake without the extension: request → approve with the wallet session
// → poll for the scoped token. The user already consented by clicking Connect, so the
// freshly-minted wallet session approves the grant on its own subject. Surfaces the
// real error at every step.
async function connectViaWallet() {
  const session = await walletSignIn();
  const cr = await fetch(NODE + "/api/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plugin: "twitter", app: "timeline-peek" }) });
  const c = await cr.json().catch(() => ({}));
  if (!cr.ok) throw new Error(c.error || ("connect " + cr.status));
  const ar = await fetch(NODE + "/api/connect/" + c.requestId + "/approve", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session }, body: "{}" });
  if (!ar.ok) { const e = await ar.json().catch(() => ({})); throw new Error(e.error || ("approve " + ar.status)); }
  const deadline = Date.now() + 30_000;
  while (Date.now() < deadline) {
    const s = await (await fetch(NODE + "/api/connect/" + c.requestId)).json().catch(() => ({}));
    if (s.status === "approved" && s.token) return s.token;
    if (s.status === "denied") throw new Error("connect denied by user");
    await new Promise(r => setTimeout(r, 1000));
  }
  throw new Error("connect timed out");
}

const shareToken = new URLSearchParams(location.search).get("token");
if (shareToken) {
  // Public share: no wallet needed, the token is in the link.
  $("go").hidden = true; $("note").textContent = "Loading shared feed…";
  loadFeed(shareToken).catch(e => { $("note").className = "note err"; $("note").textContent = String(e.message || e); });
} else {
  if (!window.oauth3) {
    // No extension (mobile / clean profile): Connect will self-provision a wallet here.
    $("note").className = "note";
    $("note").textContent = "No OAuth3 extension detected — Connect will sign you in with a wallet kept in this browser.";
  }
  $("go").addEventListener("click", async () => {
    $("note").className = "note"; $("note").textContent = "";
    const viaExt = !!window.oauth3;
    $("go").disabled = true;
    $("note").textContent = viaExt ? "Asking your wallet for a scoped token…" : "Self-provisioning a wallet in this browser…";
    try {
      const token = viaExt ? await window.oauth3.connect({ plugin: "twitter", app: "timeline-peek", node: NODE }) : await connectViaWallet();
      $("note").textContent = "Reading your feed with the scoped token…";
      await loadFeed(token);
      $("go").hidden = true; // connected — the button goes away
    } catch (e) { $("note").className = "note err"; $("note").textContent = String(e.message || e); $("go").disabled = false; }
  });
}
</script>
