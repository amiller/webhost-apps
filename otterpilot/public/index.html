<!doctype html>
<html lang="en">
<head>
<base href="/otterpilot/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>otter — follow a live meeting</title>
<!--
  Two modes, one file (model on timeline-peek / calendar-share):
   • owner   — watches their own live meeting (transcript + shared-screen slides + a
               "what were we talking about?" recap) through the server's owner token.
               With the OAuth3 extension, a "Share this live meeting" button mints a
               scoped, read-only otter token and renders a share link (?token=<scoped>)
               + a Revoke control (share-kit). The scoped cap is read /live + /frame only.
   • follow  — ?token=<scoped> in the URL: no wallet, no extension. Polls /live and /frame
               through otterpilot with that scoped token and renders the transcript stream
               + slides as they arrive. Read-only — no recap, no actions. The otter jar
               stays sealed in the TEE; the follower only ever reads through the scoped cap.
  Honest end-states throughout: a rejected token flips the banner to revoked/gone, and a
  meeting that isn't live says so (no silent stall). Errors are surfaced, never masked.
  Design: pod design system · constructivist overprint · grape-acid inking · light mode.
-->
<style>
:root{
  --ink1:#6f57a8; --ink2:#b5d33d; --paper:#f8f7f3; --deep:#2e2745; --overprint:#31491f;
  --bg:var(--paper); --text:var(--deep);
  --faint:color-mix(in srgb,var(--deep) 55%,var(--paper));
  --rule:color-mix(in srgb,var(--deep) 16%,var(--paper));
  --card:#fff; --block:var(--deep); --block-text:#f8f7f3;
  --wash1:color-mix(in srgb,var(--ink1) 15%,var(--paper));
  --wash2:color-mix(in srgb,var(--ink2) 17%,var(--paper));
  --i1-text:#5a4590; --i2-text:#6d8317;
  --warn:#a8780c; --warn-wash:color-mix(in srgb,#e0a41a 22%,var(--paper));
  --sans:"Helvetica Neue",Arial,sans-serif;
  --cond:"Arial Narrow","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --off:1px;
}
/* light mode only — per issue (pod design system, light mode) */
:root[data-theme="light"]{
  --ink1:#6f57a8; --ink2:#b5d33d; --paper:#f8f7f3; --deep:#2e2745;
  --bg:#f8f7f3; --text:#2e2745;
  --faint:color-mix(in srgb,#2e2745 55%,#f8f7f3);
  --rule:color-mix(in srgb,#2e2745 16%,#f8f7f3);
  --card:#fff; --block:#2e2745; --block-text:#f8f7f3;
  --wash1:color-mix(in srgb,#6f57a8 15%,#f8f7f3);
  --wash2:color-mix(in srgb,#b5d33d 17%,#f8f7f3);
  --i1-text:#5a4590; --i2-text:#6d8317;
  --warn:#a8780c; --warn-wash:color-mix(in srgb,#e0a41a 22%,#f8f7f3);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 var(--sans);background:var(--bg);color:var(--text);
     display:flex;flex-direction:column;height:100vh}
header{padding:12px 20px;border-bottom:2.5px solid var(--ink1);display:flex;gap:14px;
       align-items:center;flex-wrap:wrap;background:var(--paper)}
header h1{font:800 clamp(20px,3vw,26px)/0.96 var(--cond);text-transform:uppercase;margin:0;
          color:var(--ink1);text-shadow:var(--off) var(--off) 0 var(--ink2)}
.meet{color:var(--faint);font:13px var(--mono);margin-right:auto;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);display:inline-block;
     margin-right:6px;vertical-align:-1px}
.dot.live{background:var(--ink2);animation:blink .9s infinite}
@keyframes blink{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;gap:8px;font:800 13px var(--cond);
     text-transform:uppercase;letter-spacing:.1em;border:0;padding:10px 18px;cursor:pointer;
     background:var(--ink1);color:#fff;box-shadow:3px 3px 0 var(--ink2);border-radius:0}
.btn:disabled{opacity:.5;cursor:default}
.btn.warn{background:var(--ink2);color:var(--deep);box-shadow:3px 3px 0 var(--ink1)}
.btn:active{transform:translateY(1px)}
select{background:var(--card);border:1.5px solid var(--rule);color:var(--text);
       border-radius:0;padding:8px;font:inherit}
.share-panel{padding:14px 20px;border-bottom:1.5px solid var(--rule);display:flex;
             flex-direction:column;gap:12px;background:var(--bg)}
.note{color:var(--faint);font:13px/1.55 var(--mono)}
.main{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0}
.feed{overflow-y:auto;padding:16px 22px;border-right:1.5px solid var(--rule)}
.feed .u{margin:0 0 11px;color:var(--faint)}
.feed .u:last-child{color:var(--text)}
.side{display:flex;flex-direction:column;min-height:0}
.side h3{margin:0;padding:11px 18px;font:800 11px var(--cond);letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink1);border-bottom:1.5px solid var(--rule);
         background:var(--paper)}
#slides{padding:10px 14px;border-bottom:1.5px solid var(--rule);display:none;
        flex:0 0 auto;max-height:38%;overflow-y:auto;background:var(--bg)}
#slides.has{display:block}
#slides .big{width:100%;max-height:180px;object-fit:contain;border:1.5px solid var(--rule);
             display:block}
#slides .row{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
#slides .row img{height:46px;border:1.5px solid var(--rule);cursor:pointer;opacity:.65}
#slides .row img:hover{opacity:1}
#slides .cap{color:var(--faint);font:11px var(--mono);margin-top:4px}
#out{padding:16px 20px;overflow-y:auto;white-space:pre-wrap;font-size:14.5px;line-height:1.6;
     flex:1;color:var(--text)}
#out .ph{color:var(--faint)}
#out .when{color:var(--faint);font:11px var(--mono);margin-bottom:10px}
.err{color:var(--i2-text)}
</style>
</head>
<body>
<div id="sk-banner"></div>
<header>
  <h1>otter live</h1>
  <span class="meet" id="meet"><span class="dot" id="dot"></span>looking for a live meeting…</span>
  <select id="win" title="how far back to recap">
    <option value="40">last bit</option>
    <option value="120" selected>~last few min</option>
    <option value="400">longer</option>
  </select>
  <button id="recap" class="btn warn">what were we talking about?</button>
</header>

<div id="share-panel" class="share-panel">
  <div id="sk-share"></div>
  <div id="sk-receipt"></div>
</div>

<div class="main">
  <div class="feed" id="feed"></div>
  <section class="side">
    <div id="slides">
      <img class="big" id="slideBig" alt="" />
      <div class="row" id="slideRow"></div>
      <div class="cap" id="slideCap"></div>
    </div>
    <div id="recap-section">
      <h3>recap</h3>
      <div id="out"><span class="ph">Hit the button during a meeting and I'll tell you what's being discussed right now.</span></div>
    </div>
  </section>
</div>

<!-- share-kit:inline — canonical source: share-kit/share-kit.js (v0.1.0).
     Re-run: share-kit/inline.sh otterpilot (app uses public/index.html) — do not edit the block by hand. -->
<script>
/*
 * share-kit.js — one shared capability-share UI for the webhost-app suite.
 *
 * The apps on this pod are all one primitive — "share a scoped, revocable capability
 * over something that's mine, without handing over the credential" — but each was
 * expressing it differently (or not at all). share-kit is the small shared UI that makes
 * that shape visible and consistent, so learning one app teaches all of them.
 *
 * It exports THREE pieces (plus the observable ShareHandle that wires them together):
 *   1. ShareKit.shareAction(el, {label, onShare})       — the journey-labeled button
 *   2. ShareKit.capabilityReceipt(el, handle)            — link + scope sentence + revoke + status pill
 *   3. ShareKit.recipientBanner(el, handleOrOpts)        — top strip on a shared view, honest end-states
 *
 * DESIGN SYSTEM: share-kit is a *component* layer, not a token layer — exactly like the
 * pod's components.css. It CONSUMES the host app's pod design tokens (--ink1/--ink2/
 * --paper/--deep/--wash1/--wash2/--i1-text/--i2-text/--warn/--warn-wash/--block/
 * --block-text/--rule/--faint/--card/--cond/--mono/--sans/--off), so it inherits each
 * app's own inking (watermelon classic, grape-acid webhost, …) and light/dark register.
 * Your app must already define them (inline tokens.css / your :root block) — see README.
 * All styles are scoped under `.sk` and every class is `.sk-*`, so the kit never collides
 * with a host app's own .btn / .pill / .card classes.
 *
 * No dependencies, no build, no network. Adopt by inlining this one file into your app's
 * index.html (run share-kit/inline.sh <app>).
 */
(function () {
  "use strict";
  var VERSION = "0.1.0";

  var CSS = [
/* base — consumes host tokens; scoped so it never touches host styles */
".sk{font:15px/1.6 var(--sans);color:var(--text)}",
".sk *{box-sizing:border-box}",
".sk :focus-visible{outline:2px solid var(--ink2);outline-offset:2px}",
".sk .sk-err{font:13px/1.5 var(--mono);color:var(--i2-text);margin-top:8px;min-height:1px}",
/* buttons — hard-edged, two-ink shadow; same grammar as components.css .btn */
".sk .sk-btn{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--cond);text-transform:uppercase;letter-spacing:.12em;border:0;padding:12px 22px;cursor:pointer;background:var(--ink1);color:#fff;box-shadow:3px 3px 0 var(--ink2);border-radius:0}",
".sk .sk-btn:disabled{opacity:.5;cursor:default}",
".sk .sk-btn.danger{background:var(--ink2);color:var(--deep);box-shadow:3px 3px 0 var(--ink1)}",
".sk .sk-btn.quiet{background:transparent;color:var(--text);border:1px solid var(--rule);box-shadow:none;font:600 13px var(--sans);letter-spacing:0;text-transform:none;padding:9px 14px}",
/* status pills — mono; ok/warn/bad (warn is the only third ink) */
".sk .sk-pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);padding:4px 10px;border-radius:999px;text-transform:capitalize}",
".sk .sk-pill.ok{background:var(--wash1);color:var(--i1-text)}",
".sk .sk-pill.warn{background:var(--warn-wash);color:var(--warn)}",
".sk .sk-pill.bad{background:var(--wash2);color:var(--i2-text)}",
/* capability receipt — white card with an ink1 frame, like components.css .card */
".sk .sk-card{background:var(--card);border:2.5px solid var(--ink1);padding:16px 18px}",
".sk .sk-receipt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}",
".sk .sk-title{font:800 16px var(--cond);text-transform:uppercase;letter-spacing:.08em}",
".sk .sk-scope{font:13px/1.5 var(--mono);color:var(--text);margin:10px 0}",
".sk .sk-link-row{display:flex;gap:8px;align-items:stretch}",
".sk .sk-link{flex:1;min-width:0;font:12px var(--mono);padding:8px 10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--text);border-radius:0}",
".sk .sk-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}",
/* recipient banner — full-width top strip; wash ground + ink1 rule, bad/warn variants */
".sk.sk-banner{display:block;background:var(--wash1);border-bottom:2.5px solid var(--ink1);padding:10px 16px;font:13px/1.5 var(--mono);color:var(--text)}",
".sk.sk-banner.bad{background:var(--wash2);border-bottom-color:var(--ink2)}",
".sk.sk-banner.warn{background:var(--warn-wash);border-bottom-color:var(--warn)}",
".sk .sk-banner-inner{max-width:920px;margin:0 auto}",
".sk .sk-cap{font-weight:700;color:var(--i1-text)}",
".sk .sk-sep{color:var(--faint)}"
  ].join("\n");

  // inject <style id=share-kit-css> once. root defaults to document.head.
  function init(root) {
    var r = root || document.head;
    if (!r || r.querySelector("#share-kit-css")) return;
    var s = document.createElement("style");
    s.id = "share-kit-css";
    s.textContent = CSS;
    r.appendChild(s);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  /*
   * ShareHandle — the live, observable state of one shared capability.
   *
   * The app creates a handle after it mints a token; BOTH the owner-side receipt and the
   * recipient-side banner subscribe to it, so an owner revoking flips the recipient view
   * to the honest revoked state on its next render. Fields:
   *   link       — the ?token= (or ?code=) URL the recipient opens
   *   scope      — plain-English scope sentence (MUST be true; see README)
   *   owner      — who shared ("you" / a handle)
   *   thing      — what was shared ("X feed" / "one calendar event" / "live meeting")
   *   capability — recipient capability phrase ("read-only" / "edit this event" / …)
   *   status     — "active" | "revoked" | "expired"
   *   onRevoke   — async () => {} that performs the REAL revoke server-side and resolves
   *                only once confirmed. If it throws, the status is NOT flipped (the
   *                receipt re-enables and surfaces the real error — nothing masked).
   */
  function handle(opts) {
    opts = opts || {};
    var h = {
      version: VERSION,
      link: opts.link || "",
      scope: opts.scope || "",
      owner: opts.owner || "the owner",
      thing: opts.thing || "view",
      capability: opts.capability || "read-only",
      status: opts.status || "active",
      onRevoke: typeof opts.onRevoke === "function" ? opts.onRevoke : null,
      _subs: new Set(),
      subscribe: function (fn) { this._subs.add(fn); fn(this); return this; },
      set: function (patch) { Object.assign(this, patch); this._subs.forEach(function (f) { f(h); }); return this; },
      revoke: async function () {
        if (this.status !== "active") return;
        if (this.onRevoke) await this.onRevoke(); // may throw — propagate, do NOT flip
        this.set({ status: "revoked" });
      }
    };
    return h;
  }

  /*
   * 1) SHARE ACTION — the primary button, labeled by the JOURNEY ("Share my feed →"),
   *    never by the mechanism ("mint token"). Renders into `el`.
   *    opts.label   — journey label
   *    opts.onShare — async () => ShareHandle ; mint the capability however your app does
   *    opts.onShared(handle) — called once minted (typically render the receipt here)
   *    While minting the button is disabled; a mint failure is shown inline (no silent stall).
   */
  function shareAction(el, opts) {
    init(); opts = opts || {};
    var host = typeof el === "string" ? document.getElementById(el) : el;
    host.className = "sk"; host.innerHTML = "";
    var btn = el2(host, "button", "sk-btn");
    btn.type = "button"; btn.textContent = opts.label || "Share →";
    var err = el2(host, "div", "sk-err");
    btn.addEventListener("click", async function () {
      btn.disabled = true; var prev = btn.textContent; btn.textContent = "Sharing…"; err.textContent = "";
      try {
        var h = await opts.onShare();
        btn.textContent = "Shared ✓";
        if (typeof opts.onShared === "function") opts.onShared(h);
      } catch (e) {
        btn.disabled = false; btn.textContent = prev;
        err.textContent = String((e && e.message) || e);
      }
    });
    return { button: btn };
  }
  function el2(parent, tag, cls) { var e = el(tag, cls); parent.appendChild(e); return e; }

  /*
   * 2) CAPABILITY RECEIPT — link + plain-English scope sentence + status pill + Revoke.
   *    Renders into `el` from a ShareHandle and re-renders on any handle change, so a
   *    successful revoke flips the pill to "revoked" and disables Revoke.
   */
  function capabilityReceipt(host, h) {
    init();
    host = typeof host === "string" ? document.getElementById(host) : host;
    host.className = "sk";
    h.subscribe(render);
    function render(hh) {
      var st = hh.status;
      var pillCls = st === "active" ? "sk-pill ok" : st === "expired" ? "sk-pill warn" : "sk-pill bad";
      host.innerHTML =
        '<div class="sk-card">' +
          '<div class="sk-receipt-head">' +
            '<b class="sk-title">Shared link</b>' +
            '<span class="' + pillCls + '">' + esc(st) + '</span>' +
          '</div>' +
          '<div class="sk-scope">' + esc(hh.scope) + '</div>' +
          '<div class="sk-link-row">' +
            '<input class="sk-link" readonly value="' + esc(hh.link) + '">' +
            '<button class="sk-btn quiet" type="button" data-act="copy">copy</button>' +
          '</div>' +
          '<div class="sk-acts">' +
            '<button class="sk-btn danger" type="button" data-act="revoke"' + (st === "active" ? "" : " disabled") + '>' +
              (st === "active" ? "Revoke" : "Revoked") + '</button>' +
          '</div>' +
          '<div class="sk-err" data-role="err"></div>' +
        '</div>';
      var copyBtn = host.querySelector('[data-act="copy"]');
      var revokeBtn = host.querySelector('[data-act="revoke"]');
      var errEl = host.querySelector('[data-role="err"]');
      copyBtn.addEventListener("click", function () {
        var inp = host.querySelector(".sk-link");
        inp.select(); inp.setSelectionRange(0, 99999);
        try {
          navigator.clipboard.writeText(inp.value);
          copyBtn.textContent = "copied";
          setTimeout(function () { copyBtn.textContent = "copy"; }, 1200);
        } catch (_) { try { document.execCommand("copy"); } catch (_) {} }
      });
      revokeBtn.addEventListener("click", async function () {
        revokeBtn.disabled = true; var prev = revokeBtn.textContent; revokeBtn.textContent = "Revoking…"; errEl.textContent = "";
        try { await h.revoke(); }
        catch (e) { revokeBtn.disabled = false; revokeBtn.textContent = prev; errEl.textContent = String((e && e.message) || e); }
      });
    }
    return h;
  }

  /*
   * 3) RECIPIENT BANNER — top strip on a shared view.
   *    "You're viewing <owner>'s shared <thing> · <capability>", and an HONEST end-state
   *    when revoked / expired / gone — never a silent stall (anti-hollow-green, applied to UX).
   *    Pass a ShareHandle to stay in sync with an owner-side revoke, or a static opts
   *    object ({owner, thing, capability, status}) to render once.
   */
  function recipientBanner(host, h) {
    init();
    host = typeof host === "string" ? document.getElementById(host) : host;
    function render(hh) {
      var state = hh.status || "active";
      var cap = hh.capability || "read-only";
      var cls = "sk sk-banner";
      var body;
      if (state === "active") {
        body = "You're viewing <b>" + esc(hh.owner) + "</b>'s shared " + esc(hh.thing) +
               ' <span class="sk-sep">·</span> <span class="sk-cap">' + esc(cap) + "</span>";
      } else if (state === "revoked") {
        cls += " bad";
        body = "This share was <b>revoked by the owner</b>. The link no longer works.";
      } else if (state === "expired") {
        cls += " warn";
        body = "This share has <b>expired</b>. Ask the owner for a fresh link.";
      } else { // "gone" or anything unknown — honest, doesn't over-claim a specific reason
        cls += " bad";
        body = "This share is <b>no longer available</b> — it was revoked or has expired.";
      }
      host.className = cls;
      host.innerHTML = '<div class="sk-banner-inner">' + body + "</div>";
    }
    if (h && typeof h.subscribe === "function") { h.subscribe(render); return h; }
    render(Object.assign({ capability: "read-only", status: "active" }, h || {}));
    return h || {};
  }

  window.ShareKit = {
    VERSION: VERSION,
    CSS: CSS,
    init: init,
    handle: handle,
    shareAction: shareAction,
    capabilityReceipt: capabilityReceipt,
    recipientBanner: recipientBanner,
    esc: esc
  };
})();

</script>

<script>
const $ = (id) => document.getElementById(id);
const feed = $("feed"), out = $("out"), meet = $("meet"), dot = $("dot");
const btn = $("recap"), win = $("win");
const slides = $("slides"), slideBig = $("slideBig");
const slideRow = $("slideRow"), slideCap = $("slideCap");
const NODE = location.origin + "/oauth3";
ShareKit.init();   // inject the share-kit <style> once (consumes the pod tokens above)

let after = 0, segs = [], live = false, lastSlide = "";
let pollTimer = null, followBanner = null;

const shareToken = new URLSearchParams(location.search).get("token");
const FOLLOW = !!shareToken;

// follow mode: the <img> can't carry an Authorization header, so the scoped token rides
// on the frame URL as &token=. Owner mode uses the server's owner token (no query needed).
const imgSrc = (src) => FOLLOW ? src + "&token=" + encodeURIComponent(shareToken) : src;

function renderSlides(images, isLive) {
  if (!isLive) { slides.classList.remove("has"); return; }
  slides.classList.add("has");
  if (!images.length) {
    slideBig.style.display = "none"; slideRow.innerHTML = "";
    slideCap.textContent = "no screenshots yet — Otter only captures the shared screen when OtterPilot joins the call";
    return;
  }
  slideBig.style.display = "block";
  const newest = imgSrc(images[images.length - 1].src);
  if (newest !== lastSlide) { slideBig.src = newest; lastSlide = newest; }
  slideRow.innerHTML = "";
  for (const im of images.slice().reverse()) {
    const t = document.createElement("img"); t.src = imgSrc(im.src);
    t.onclick = () => { slideBig.src = imgSrc(im.src); };
    slideRow.appendChild(t);
  }
  slideCap.textContent = images.length + " screenshot" + (images.length > 1 ? "s" : "") + " captured";
}

async function poll() {
  try {
    const headers = FOLLOW ? { Authorization: "Bearer " + shareToken } : {};
    const r = await fetch("live?after=" + after, { headers });
    const d = await r.json();
    if (d.error) {
      meet.innerHTML = '<span class="dot"></span>' + d.error;
      live = false; renderSlides([], false);
      // honest end-state: a token rejection means the share is revoked/expired/gone.
      if (FOLLOW && /401|403|revok|expire|invalid|unauthor|no jar|not logged/i.test(String(d.error))) {
        if (followBanner) followBanner.set({ status: "gone" });
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }
    } else if (!d.live) {
      live = false; renderSlides([], false);
      meet.innerHTML = '<span class="dot"></span>' +
        (FOLLOW ? "waiting for the live meeting to start…" : "no live meeting right now");
    } else {
      live = true;
      meet.innerHTML = '<span class="dot live"></span>' + (d.title || "live meeting");
      for (const s of d.segments) {
        segs.push(s.text);
        const p = document.createElement("p"); p.className = "u"; p.textContent = s.text;
        feed.appendChild(p);
      }
      if (d.segments.length) feed.scrollTop = feed.scrollHeight;
      after = d.max_order;
      renderSlides(d.images || [], true);
    }
  } catch (e) {
    meet.innerHTML = '<span class="dot"></span>server unreachable';
  }
}

// recap is owner-only — follow mode hides the button + section entirely.
if (!FOLLOW) {
  btn.onclick = async () => {
    const n = parseInt(win.value, 10);
    const text = segs.slice(-n).join(" ");
    if (!text.trim()) { out.innerHTML = '<span class="ph">No transcript captured yet.</span>'; return; }
    btn.disabled = true; out.innerHTML = '<span class="ph">thinking…</span>';
    try {
      const r = await fetch("recap", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }) });
      const d = await r.json();
      if (d.error) out.innerHTML = '<span class="err">' + d.error + '</span>';
      else out.innerHTML = '<div class="when">' + new Date().toLocaleTimeString() +
        (d.used_slide ? ' · read the current slide 🖼️' : '') + '</div>' +
        d.summary.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    } catch (e) { out.innerHTML = '<span class="err">recap failed: ' + e + '</span>'; }
    btn.disabled = false;
  };
}

// --- mode wiring ---
if (FOLLOW) {
  // read-only live follow: no recap/share UI; banner up top; honest end-states on revoke.
  $("share-panel").style.display = "none";
  $("recap").style.display = "none";
  $("win").style.display = "none";
  $("recap-section").style.display = "none";
  followBanner = ShareKit.handle({
    owner: "the owner", thing: "live meeting", capability: "read-only", status: "active"
  });
  ShareKit.recipientBanner($("sk-banner"), followBanner);
  poll(); pollTimer = setInterval(poll, 8000);
} else {
  // owner mode: live view via the server's owner token; Share needs the extension to mint
  // a scoped otter token from the browser.
  $("sk-banner").style.display = "none";
  if (window.oauth3 && window.ShareKit) {
    renderOwnerShare();
  } else {
    $("share-panel").innerHTML =
      '<div class="note">Sharing needs the OAuth3 extension — open otterpilot in a browser with it to mint a read-only follow link. Your own live view + recap work without it.</div>';
  }
  poll(); pollTimer = setInterval(poll, 8000);
}

// --- share-kit wiring (owner mode) ---
// The Share button mints a scoped otter token via the extension (the browser holds it for
// sharing only; the owner's own view still goes through the server's owner token). The
// receipt carries a TRUE scope sentence + a Revoke that DELETEs the token at the node.
// share-kit only flips the pill to "revoked" once that resolves — nothing masked.
function renderOwnerShare() {
  ShareKit.shareAction($("sk-share"), {
    label: "Share this live meeting →",
    async onShare() {
      const tok = await window.oauth3.connect({ plugin: "otter", app: "otterpilot", caps: ["otter:live-follow"], node: NODE });
      const here = location.pathname.replace(/(index\.html)?$/, "");
      const link = location.origin + here + "?token=" + encodeURIComponent(tok);
      return ShareKit.handle({
        link,
        scope: "read-only · this live meeting, until it ends · no recap, no actions",
        owner: "you", thing: "live meeting", capability: "read-only",
        onRevoke: () => revokeToken(tok),
      });
    },
    onShared(h) { ShareKit.capabilityReceipt($("sk-receipt"), h); $("sk-share").hidden = true; }
  });
}

// DELETE /api/tokens/:token — on the extension path the wallet holds the session, so this
// may 401 from a raw browser context until the extension exposes a revoke bridge. share-kit
// surfaces the real error and leaves the pill active (honest — not masked).
async function revokeToken(t) {
  const headers = { "Content-Type": "application/json" };
  const r = await fetch(NODE + "/api/tokens/" + encodeURIComponent(t), { method: "DELETE", headers });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ("revoke " + r.status));
}
</script>
