[program:twitter-agent]
command=/opt/agent/node_modules/.bin/tsx /opt/agent/server.ts
directory=/opt/agent
environment=DISPLAY=":99.0",PORT="8090",BRIDGE_URL="http://localhost:3000",SCREEN_H="720"
autostart=true
autorestart=true
priority=910
startsecs=3
stdout_logfile=/var/log/neko/twitter-agent.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
