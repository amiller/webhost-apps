[package]
name = "attest-verify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bitrouter-attestation = "1.0.0-alpha.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
async-trait = "0.1"
hex = "0.4"
sha3 = "0.10"
rand = "0.9"

[profile.release]
strip = true
lto = true
